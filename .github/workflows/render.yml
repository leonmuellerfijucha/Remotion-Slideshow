name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      editingData:
        description: 'Editing data JSON string'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version
      
      - name: Install dependencies
        run: npm install
      
      - name: Check Remotion binary
        run: |
          echo "Checking Remotion..."
          ls -la node_modules/.bin/ | grep -i remotion
          file node_modules/.bin/remotion || echo "Not a file"
          chmod +x node_modules/.bin/remotion 2>/dev/null || true
          ./node_modules/.bin/remotion --version || echo "Remotion version check failed"
      
      - name: Create editingData.json
        run: |
          if [ -n "${{ github.event.inputs.editingData }}" ]; then
            echo '${{ github.event.inputs.editingData }}' > editingData.json
          fi
          cat editingData.json || echo "No editingData.json"
      
      - name: Download assets
        run: python3 download_assets.py || echo "Download failed"
      
      - name: List files
        run: |
          pwd
          ls -la
          ls -la src/ || echo "No src/"
          ls -la public/assets/ || echo "No assets/"
      
      - name: Test Remotion (list compositions)
        run: |
          echo "Listing compositions..."
          ./node_modules/.bin/remotion compositions src/Root.tsx || echo "Compositions list failed"
      
      - name: Render video (simple)
        run: |
          echo "Rendering video..."
          ./node_modules/.bin/remotion render Slideshow out/video.mp4 2>&1
          echo "Render exit code: $?"
          ls -la out/ || echo "No out/ directory"
      
      - name: Check video
        run: |
          if [ -f "out/video.mp4" ]; then
            ls -lh out/video.mp4
            echo "✅ Video rendered successfully!"
          else
            echo "❌ Video not found"
            exit 1
          fi
      
      - name: Upload video as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
