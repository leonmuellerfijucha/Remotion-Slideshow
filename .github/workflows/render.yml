name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      editingData:
        description: 'Editing data JSON string'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version
      
      - name: Install dependencies
        run: npm install
      
      - name: Check Remotion installation
        run: |
          echo "Checking Remotion installation..."
          ls -la node_modules/.bin/ | grep -i remotion || echo "Remotion not found in .bin"
          cat node_modules/remotion/package.json | grep '"version"' || echo "Remotion package not found"
          # Try to find the remotion binary
          find node_modules -name "remotion*" -type f 2>/dev/null | head -5
      
      - name: Create editingData.json
        run: |
          if [ -n "${{ github.event.inputs.editingData }}" ]; then
            echo '${{ github.event.inputs.editingData }}' > editingData.json
          fi
          cat editingData.json
      
      - name: Download assets
        run: python3 download_assets.py
      
      - name: List files before render
        run: |
          pwd
          ls -la
          ls -la src/ || echo "No src/"
          ls -la public/assets/ || echo "No assets/"
      
      - name: Render video (using direct path)
        run: |
          echo "Rendering video..."
          # Use the direct path to remotion binary
          ./node_modules/.bin/remotion render Slideshow out/video.mp4 --props=editingData.json
          echo "Render exit code: $?"
          ls -la out/ || echo "No out/ directory"
      
      - name: Check video
        run: |
          if [ -f "out/video.mp4" ]; then
            ls -lh out/video.mp4
            echo "✅ Video rendered successfully!"
          else
            echo "❌ Video not found"
            exit 1
          fi
      
      - name: Upload video as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
