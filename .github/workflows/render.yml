name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      editingData:
        description: 'Editing data JSON string'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Node.js manually
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version
      
      - name: Install dependencies
        run: npm install || npm install --legacy-peer-deps || echo "npm install failed, continuing..."
        continue-on-error: true
      
      - name: Create editingData.json
        run: |
          if [ -n "${{ github.event.inputs.editingData }}" ]; then
            echo '${{ github.event.inputs.editingData }}' > editingData.json
          fi
          cat editingData.json || echo "{}" > editingData.json
      
      - name: Download assets
        run: python3 download_assets.py || echo "Download failed, continuing..."
        continue-on-error: true
      
      - name: List files
        run: |
          pwd
          ls -la
          ls -la src/ || echo "No src/"
          ls -la public/assets/ || echo "No assets/"
      
      - name: Render video
        run: |
          npx remotion render Slideshow out/video.mp4 --props=editingData.json 2>&1 || \
          npx remotion render src/Slideshow.tsx out/video.mp4 2>&1 || \
          echo "Render failed"
        continue-on-error: true
      
      - name: Check video
        run: |
          if [ -f "out/video.mp4" ]; then
            ls -lh out/video.mp4
            echo "✅ Video rendered!"
          else
            echo "❌ Video not found"
            exit 1
          fi
      
      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-video
          path: out/video.mp4
          if-no-files-found: warn
