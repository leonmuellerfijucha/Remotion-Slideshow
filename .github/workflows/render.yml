name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      editingData:
        description: 'Editing data JSON string'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install || npm install --legacy-peer-deps
        continue-on-error: true
      
      - name: Create editingData.json
        run: |
          if [ -n "${{ github.event.inputs.editingData }}" ]; then
            echo '${{ github.event.inputs.editingData }}' > editingData.json
          fi
          cat editingData.json || echo "No editingData.json"
      
      - name: Download assets
        run: |
          if [ -f "download_assets.py" ]; then
            python3 download_assets.py
          else
            echo "No download_assets.py found"
          fi
        continue-on-error: true
      
      - name: List files
        run: |
          ls -la
          ls -la src/ || echo "No src/ dir"
          ls -la public/assets/ || echo "No assets downloaded"
      
      - name: Render video
        run: |
          npx remotion render Slideshow out/video.mp4 --props=editingData.json || \
          npx remotion render src/Slideshow.tsx out/video.mp4 || \
          echo "Render failed"
        continue-on-error: true
      
      - name: Check video
        run: |
          if [ -f "out/video.mp4" ]; then
            ls -lh out/video.mp4
            echo "✅ Video rendered successfully!"
          else
            echo "❌ Video not found"
            exit 1
          fi
      
      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-video
          path: out/video.mp4
          if-no-files-found: warn
