name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      editingData:
        description: 'Editing data JSON string'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version
      
      - name: Install dependencies
        run: npm install
      
      - name: Create editingData.json
        run: |
          if [ -n "${{ github.event.inputs.editingData }}" ]; then
            echo '${{ github.event.inputs.editingData }}' > editingData.json
          fi
          cat editingData.json
      
      - name: Download assets
        run: python3 download_assets.py
      
      - name: List files
        run: |
          pwd
          ls -la
          ls -la src/ || true
          ls -la public/assets/ || true
      
      - name: Render video
        run: |
          echo "Rendering video..."
          npx remotion render Slideshow out/video.mp4 --props=editingData.json
          echo "Render complete!"
          ls -la out/video.mp4
      
      - name: Upload video as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
