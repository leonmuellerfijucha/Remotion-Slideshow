name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      editingData:
        description: 'Editing data JSON string'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Node.js manually
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version
      
      - name: Install dependencies
        run: npm install || npm install --legacy-peer-deps || echo "npm install failed"
        continue-on-error: true
      
      - name: Create editingData.json
        run: |
          if [ -n "${{ github.event.inputs.editingData }}" ]; then
            echo '${{ github.event.inputs.editingData }}' > editingData.json
          fi
          cat editingData.json || echo "{}" > editingData.json
      
      - name: Download assets
        run: python3 download_assets.py || echo "Download failed"
        continue-on-error: true
      
      - name: List files before render
        run: |
          pwd
          ls -la
          ls -la src/ || echo "No src/"
          ls -la public/assets/ || echo "No assets/"
      
      - name: Render video
        run: |
          npx remotion render Slideshow out/video.mp4 --props=editingData.json 2>&1 || \
          npx remotion render src/Slideshow.tsx out/video.mp4 2>&1 || \
          echo "Render command failed"
        continue-on-error: true
      
      - name: Find video file
        run: |
          echo "Searching for video files..."
          find . -name "*.mp4" -type f 2>/dev/null || echo "No mp4 files found"
          ls -la out/ 2>/dev/null || echo "No out/ directory"
          # If video not in out/, copy it there
          VIDEO=$(find . -name "*.mp4" -type f | head -1)
          if [ -n "$VIDEO" ] && [ ! -f "out/video.mp4" ]; then
            mkdir -p out
            cp "$VIDEO" out/video.mp4
            echo "Copied $VIDEO to out/video.mp4"
          fi
      
      - name: Check video
        run: |
          if [ -f "out/video.mp4" ]; then
            ls -lh out/video.mp4
            echo "✅ Video found at out/video.mp4!"
          else
            echo "❌ Video not found in out/"
            exit 1
          fi
      
      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-video
          path: out/video.mp4
          if-no-files-found: warn
